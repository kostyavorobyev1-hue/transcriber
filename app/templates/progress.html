{% extends 'base.html' %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 py-8 sm:py-12" x-data="progressApp('{{ task_id }}')">
  <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-6 sm:p-10 shadow-sm text-center">
    
    <!-- State: Processing -->
    <template x-if="status !== 'completed' && status !== 'failed'">
      <div class="space-y-6">
        <h2 class="text-2xl font-bold animate-pulse text-gray-900 dark:text-gray-100" x-text="message || 'Запуск…'"></h2>
        
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-4 overflow-hidden shadow-inner">
          <div class="bg-primary h-4 rounded-full transition-all duration-300 ease-out"
               :style="`width: ${progress}%`"></div>
        </div>
        
        <p class="text-gray-500 dark:text-gray-400 font-mono" x-text="`${progress}%`"></p>
        
        <div class="text-sm text-gray-400 mt-4">
          ID задачи: <span class="font-mono text-xs select-all bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded" x-text="taskId"></span>
        </div>
      </div>
    </template>

    <!-- State: Completed -->
    <template x-if="status === 'completed'">
      <div class="space-y-6 text-left">
        <div class="flex flex-col border-b pb-4 mb-4 border-gray-200 dark:border-gray-700 gap-4">
          <h2 class="text-2xl font-semibold text-green-600 dark:text-green-400 flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            Расшифровка готова!
          </h2>
          <div class="flex flex-col sm:flex-row flex-wrap gap-2 w-full sm:w-auto">
            <button type="button" @click="downloadProtocol()" :disabled="protocolLoading"
              class="btn btn-primary text-sm w-full sm:w-auto whitespace-nowrap disabled:opacity-70 disabled:cursor-wait"
              title="Gemini составит протокол встречи по шаблону и скачает его в .txt">
              <svg x-show="protocolLoading" class="w-4 h-4 mr-2 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>
              <span x-text="protocolLoading ? 'Составляю протокол…' : 'Скачать протокол (.txt)'"></span>
            </button>
            <button type="button" @click="copyText(forAi())" class="btn btn-accent text-sm w-full sm:w-auto whitespace-nowrap" x-show="prompt" x-text="copied === 'ai' ? 'Скопировано ✓' : 'Копировать для ИИ'"
              title="Шаблон протокола встречи + расшифровка с тайм-кодами — вставьте в Claude или ChatGPT"></button>
            <button type="button" @click="copyText(result.text, 'text')" class="btn btn-secondary text-sm w-full sm:w-auto whitespace-nowrap" x-text="copied === 'text' ? 'Скопировано ✓' : 'Копировать'"></button>
            <a :href="`/download/${result.filename}`" class="btn bg-gray-600 hover:bg-gray-500 text-sm w-full sm:w-auto text-center whitespace-nowrap">Скачать расшифровку (.txt)</a>
          </div>
          <p x-show="protocolLoading" class="text-sm text-gray-500 dark:text-gray-400">Обычно это занимает до минуты, для длинных встреч — дольше.</p>
          <p x-show="protocolError" class="text-sm text-red-600 dark:text-red-400" x-text="protocolError"></p>
        </div>
        
        <div class="bg-gray-50 dark:bg-gray-900 p-4 sm:p-6 rounded-xl border border-gray-200 dark:border-gray-700 font-mono text-sm whitespace-pre-wrap max-h-[60vh] overflow-y-auto text-gray-800 dark:text-gray-300"
             x-text="result.text"></div>
             
        <div class="text-center pt-4">
          <a href="/" class="text-primary hover:text-secondary font-medium transition-colors hover:underline">Расшифровать другой файл</a>
        </div>
      </div>
    </template>

    <!-- State: Failed -->
    <template x-if="status === 'failed'">
      <div class="space-y-6">
        <div class="text-red-500 text-6xl mb-4">⚠️</div>
        <h2 class="text-2xl font-bold text-red-600 dark:text-red-400">Ошибка расшифровки</h2>
        <p class="text-gray-700 dark:text-gray-300" x-text="message"></p>
        <div class="pt-6">
          <a href="/" class="btn btn-secondary">Попробовать снова</a>
        </div>
      </div>
    </template>

  </div>
</section>

<script type="application/json" id="protocol-prompt">{{ protocol_prompt()|tojson }}</script>
<script>
  function progressApp(taskId) {
    return {
      taskId: taskId,
      status: 'pending', // pending, processing, completed, failed
      progress: 0,
      message: 'Подключение…',
      result: null,
      socket: null,
      copied: null,
      prompt: JSON.parse(document.getElementById('protocol-prompt').textContent),

      init() {
        this.connect();
      },

      protocolLoading: false,
      protocolError: '',

      async downloadProtocol() {
        this.protocolLoading = true;
        this.protocolError = '';
        try {
          const resp = await fetch(`/protocol/${encodeURIComponent(this.result.filename)}`, { method: 'POST' });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `Ошибка ${resp.status}`);
          }
          const name = this.result.filename.replace(/\.txt$/, '') + '_protocol.txt';
          const url = URL.createObjectURL(await resp.blob());
          const a = Object.assign(document.createElement('a'), { href: url, download: name });
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (e) {
          this.protocolError = `Не удалось составить протокол: ${e.message}`;
        } finally {
          this.protocolLoading = false;
        }
      },

      forAi() {
        return `${this.prompt}\n\n## ТРАНСКРИПТ\nКаждая строка начинается с тайм-кода [чч:мм:сс] от начала записи.\n\n${this.result.text}`;
      },

      async copyText(text, kind = 'ai') {
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          // Fallback for contexts where the Clipboard API is unavailable
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        this.copied = kind;
        setTimeout(() => this.copied = null, 2000);
      },
      
      connect() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/progress/${this.taskId}`;
        
        this.socket = new WebSocket(wsUrl);
        
        this.socket.onopen = () => {
          console.log('WS Connected');
        };
        
        this.socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          this.status = data.status;
          this.progress = data.progress;
          this.message = data.message;
          
          if (data.result) {
            this.result = data.result;
          }
          
          if (this.status === 'completed' || this.status === 'failed') {
            this.socket.close();
          }
        };
        
        this.socket.onclose = () => {
          if (this.status !== 'completed' && this.status !== 'failed') {
            // Tentar reconectar se cair inesperadamente
            setTimeout(() => this.connect(), 2000);
          }
        };
      }
    }
  }
</script>
{% endblock %}
